    <style>
      @font-face {
        font-family: 'Space Grotesk'; font-style: normal; font-weight: 300 700; font-display: block;
        src: url('assets/fonts/space-grotesk-latin-ext-wght-normal.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Space Grotesk'; font-style: normal; font-weight: 300 700; font-display: block;
        src: url('assets/fonts/space-grotesk-latin-wght-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: Inter; font-style: normal; font-weight: 100 900; font-display: block;
        src: url('assets/fonts/inter-latin-wght-normal.woff2') format('woff2');
      }
      :root {
        --bg: #0f0f0f;
        --lime: #cafb22;
        --ink: #f7f7f5;
        --edge: #383838;
        --shadow: rgb(0 0 0 / 42%);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: var(--bg); color: var(--ink);
        font-family: 'Space Grotesk', sans-serif;
      }
      #stage { position: relative; width: 1080px; height: 1920px; background: var(--bg); }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .scene-content {
        display: flex; flex-direction: column; align-items: stretch;
        width: 100%; height: 100%; padding: 96px 80px 92px;
      }
      .brand {
        display: flex; align-items: center; height: 46px; flex-shrink: 0;
        font-family: Inter, sans-serif; font-size: 38px; line-height: 46px;
        font-weight: 600; letter-spacing: -0.04em;
      }
      .brand-dot { width: 13px; height: 13px; margin-left: 12px; border-radius: 50%; background: var(--lime); }
      .headline {
        display: flex; flex-direction: column; flex-shrink: 0;
        margin: 112px 0 0; height: 260px;
        font-size: 104px; line-height: 118px;
        font-weight: 700; letter-spacing: -0.045em;
      }
      .headline-line { display: block; width: 920px; white-space: nowrap; }
      .headline-emphasis { display: grid; width: 920px; }
      .headline-emphasis > span { grid-area: 1 / 1; }
      .headline-base { color: var(--lime); }
      .wp-word {
        color: var(--ink); clip-path: inset(0 100% 0 0);
        will-change: clip-path; pointer-events: none;
      }
      .s3-stage {
        display: flex; align-items: flex-start; justify-content: space-between;
        align-self: center; width: 976px; margin-top: 178px; flex-shrink: 0;
      }
      .s3-phone {
        position: relative; width: 460px; flex-shrink: 0;
        transform-origin: center center; will-change: transform;
        filter: drop-shadow(0 12px 18px var(--shadow));
      }
      .s3-phone-right { margin-top: 66px; }
      .s3-screen {
        display: block; width: 460px; height: auto;
        border: 1px solid var(--edge); border-radius: 42px;
      }

  <body>
    <main id="stage" data-composition-id="strength-save-en" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">
      <section id="store-loop" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <div class="scene-content">
          <div class="brand">Strength Save<span class="brand-dot" aria-hidden="true"></span></div>
          <h1 class="headline">
            <span class="headline-line">Log your sets.</span>
            <span class="headline-line headline-emphasis">
              <span class="headline-base">See your progress.</span>
              <span id="headline-wipe" class="wp-word" aria-hidden="true">See your progress.</span>
            </span>
          </h1>
          <div class="s3-stage" id="s3Stage">
            <div class="s3-phone s3-phone-left" id="s3PhoneLeft">
              <img class="s3-screen" id="workout-capture" src="assets/en/workout.png" alt="Log sets in Strength Save" />
            </div>
            <div class="s3-phone s3-phone-right" id="s3PhoneRight">
              <img class="s3-screen" id="progress-capture" src="assets/en/progress.png" alt="Training progress in Strength Save" />
            </div>
          </div>
        </div>
      </section>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // The two catalog phone wrappers carry complete native captures throughout.
      // Explicit start and end poses preserve identity and the eight-second loop seam.
      tl.fromTo('#s3PhoneLeft', { x: 0, y: 0, rotation: -2 },
        { x: 10, y: 18, rotation: -1.5, duration: 4, ease: 'sine.inOut' }, 0);
      tl.fromTo('#s3PhoneLeft', { x: 10, y: 18, rotation: -1.5 },
        { x: 0, y: 0, rotation: -2, duration: 4, ease: 'sine.inOut', immediateRender: false }, 4);
      tl.fromTo('#s3PhoneRight', { x: 0, y: 0, rotation: 2 },
        { x: -8, y: -16, rotation: 1.5, duration: 4, ease: 'sine.inOut' }, 0);
      tl.fromTo('#s3PhoneRight', { x: -8, y: -16, rotation: 1.5 },
        { x: 0, y: 0, rotation: 2, duration: 4, ease: 'sine.inOut', immediateRender: false }, 4);

      // Adapted caption-clip-wipe: a clipped duplicate changes color without hiding copy.
      tl.fromTo('#headline-wipe', { clipPath: 'inset(0 100% 0 0)' },
        { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power2.out' }, 3.2);
      tl.fromTo('#headline-wipe', { clipPath: 'inset(0 0% 0 0)' },
        { clipPath: 'inset(0 100% 0 0)', duration: 0.5, ease: 'power2.inOut', immediateRender: false }, 6.7);

      window.__timelines['strength-save-en'] = tl;
      tl.seek(0);
    </script>
  </body>
